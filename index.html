<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Learning</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <h1>📚 IELTS Learning</h1>
    <p>Reading & Listening Practice</p>
</header>

<section class="profile">

    <div class="card">
        <h2>Tiến độ học</h2>

        <div class="progress-bar">
            <div class="progress"></div>
        </div>

        <p>0 / 50 Chủ đề</p>
    </div>

    <div class="card xp">
        ⭐ XP: <span id="xp">0</span>
    </div>

    <div class="card badge">
        🏅 Chưa có huy hiệu
    </div>

</section>

<section class="continue">

    <button class="continue-btn">
        ▶ Tiếp tục học
    </button>

</section>

<section class="lesson-list">

<h2>Danh sách chủ đề</h2>

<div class="lesson">
    <span>📘 Lesson 01</span>
    <button>Học</button>
</div>

<div class="lesson">
    <span>📘 Lesson 02</span>
    <button>Học</button>
</div>

<div class="lesson">
    <span>📘 Lesson 03 - Science and Research</span>
    <button>Học</button>
</div>

<div class="lesson">
    <span>🔒 Lesson 04</span>
</div>

<div class="lesson">
    <span>🔒 Lesson 05</span>
</div>

<div class="lesson">
    <span>...</span>
</div>

</section>

<script src="js/app.js"></script>

</body>
</html>
